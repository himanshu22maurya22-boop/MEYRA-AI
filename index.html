    <script>
      (function() {
        try {
          var saved = localStorage.getItem("meyra_theme");
          if (!saved) {
            try {
              var s = JSON.parse(localStorage.getItem("meyra_settings") || "{}");
              if (s && s.theme) saved = s.theme;
            } catch(e) {}
          }
          var resolved = "dark";
          if (saved === "light") {
            resolved = "light";
          } else if (saved === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } else {
            resolved = "dark";
          }
          var doc = document.documentElement;
          doc.classList.remove("dark", "light");
          doc.classList.add(resolved);
          doc.setAttribute("data-theme", resolved);
          doc.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
