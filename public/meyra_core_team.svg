<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#0D0D16"/>
      <stop offset="100%" stop-color="#07070A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181824" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#101018" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>
  <rect width="1200" height="675" fill="url(#glow3)"/>

  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Outer Emblem Hexagon/Circle -->
    <circle cx="0" cy="-10" r="32" fill="#13131F" stroke="url(#logoGrad)" stroke-width="2.5"/>
    <!-- M Emblem Path -->
    <path d="M-14,4 L-14,-22 L-2,-7 L0,-5 L2,-7 L14,-22 L14,4" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-21" r="2.5" fill="#38BDF8"/>

    <!-- Brand Name -->
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="4">MEYRA AI</text>
    <!-- Subtitle Pill -->
    <rect x="-130" y="56" width="260" height="24" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#A5B4FC" letter-spacing="2">CORE LEADERSHIP TEAM</text>
  </g>

  <!-- ==================== CARD 1: HIMANSHU MAURYA ==================== -->
  <g transform="translate(70, 195)">
    <!-- Card Frame -->
    <rect width="330" height="370" rx="20" fill="url(#cardGrad)" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect width="330" height="4" rx="2" fill="url(#goldGrad)"/>

    <!-- Avatar Circle -->
    <g transform="translate(165, 68)">
      <circle cx="0" cy="0" r="42" fill="#241B0E" stroke="url(#goldGrad)" stroke-width="2"/>
      <circle cx="0" cy="0" r="36" fill="#1A140A"/>
      <text x="0" y="7" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FCD34D" text-anchor="middle">HM</text>
      <!-- Crown Icon / Badge -->
      <circle cx="28" cy="-28" r="14" fill="#F59E0B"/>
      <text x="28" y="-22" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">👑</text>
    </g>

    <!-- Name & Title -->
    <text x="165" y="145" font-family="system-ui, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">Himanshu Maurya</text>
    <rect x="70" y="158" width="190" height="26" rx="13" fill="#362208" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1"/>
    <text x="165" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="0.5">Founder / CEO / CTO</text>

    <!-- Divider -->
    <line x1="30" y1="202" x2="300" y2="202" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- Responsibilities -->
    <g font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" transform="translate(32, 230)">
      <!-- Bullet 1 -->
      <circle cx="6" cy="-4" r="3" fill="#F59E0B"/>
      <text x="18" y="0" font-weight="700" fill="#FCD34D">Founder</text>
      <text x="72" y="0" fill="#94A3B8">— MEYRA AI creator</text>

      <!-- Bullet 2 -->
      <circle cx="6" cy="34" r="3" fill="#F59E0B"/>
      <text x="18" y="38" font-weight="700" fill="#FCD34D">CEO</text>
      <text x="48" y="38" fill="#94A3B8">— Vision &amp; Leadership</text>
      <text x="18" y="55" font-size="11" fill="#64748B">Major company decisions</text>

      <!-- Bullet 3 -->
      <circle cx="6" cy="88" r="3" fill="#F59E0B"/>
      <text x="18" y="92" font-weight="700" fill="#FCD34D">CTO</text>
      <text x="49" y="92" fill="#94A3B8">— Technology &amp; AI</text>
      <text x="18" y="109" font-size="11" fill="#64748B">Systems &amp; Product Architecture</text>
    </g>
  </g>

  <!-- ==================== CARD 2: ADITYA MAURYA ==================== -->
  <g transform="translate(435, 195)">
    <!-- Card Frame -->
    <rect width="330" height="370" rx="20" fill="url(#cardGrad)" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect width="330" height="4" rx="2" fill="url(#cyanGrad)"/>

    <!-- Avatar Circle -->
    <g transform="translate(165, 68)">
      <circle cx="0" cy="0" r="42" fill="#0C232B" stroke="url(#cyanGrad)" stroke-width="2"/>
      <circle cx="0" cy="0" r="36" fill="#071920"/>
      <text x="0" y="7" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#67E8F9" text-anchor="middle">AM</text>
      <!-- Lightning Icon / Badge -->
      <circle cx="28" cy="-28" r="14" fill="#0284C7"/>
      <text x="28" y="-22" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">⚡</text>
    </g>

    <!-- Name & Title -->
    <text x="165" y="145" font-family="system-ui, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">Aditya Maurya</text>
    <rect x="75" y="158" width="180" height="26" rx="13" fill="#0E3342" stroke="#06B6D4" stroke-opacity="0.6" stroke-width="1"/>
    <text x="165" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#A5F3FC" text-anchor="middle" letter-spacing="0.5">Co-Founder / COO</text>

    <!-- Divider -->
    <line x1="30" y1="202" x2="300" y2="202" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- Responsibilities -->
    <g font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" transform="translate(32, 230)">
      <!-- Bullet 1 -->
      <circle cx="6" cy="-4" r="3" fill="#06B6D4"/>
      <text x="18" y="0" font-weight="700" fill="#67E8F9">Co-Founder</text>
      <text x="96" y="0" fill="#94A3B8">— Co-Founder</text>
      <text x="18" y="17" font-size="11" fill="#64748B">Strategic company growth</text>

      <!-- Bullet 2 -->
      <circle cx="6" cy="48" r="3" fill="#06B6D4"/>
      <text x="18" y="52" font-weight="700" fill="#67E8F9">COO</text>
      <text x="50" y="52" fill="#94A3B8">— Operations &amp; Execution</text>
      <text x="18" y="70" font-size="11" fill="#64748B">Team coordination &amp; workflows</text>
      <text x="18" y="87" font-size="11" fill="#64748B">Day-to-day business operations</text>
    </g>
  </g>

  <!-- ==================== CARD 3: MEETHI YADAV ==================== -->
  <g transform="translate(800, 195)">
    <!-- Card Frame -->
    <rect width="330" height="370" rx="20" fill="url(#cardGrad)" stroke="#C084FC" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect width="330" height="4" rx="2" fill="url(#purpleGrad)"/>

    <!-- Avatar Circle -->
    <g transform="translate(165, 68)">
      <circle cx="0" cy="0" r="42" fill="#261233" stroke="url(#purpleGrad)" stroke-width="2"/>
      <circle cx="0" cy="0" r="36" fill="#1C0A26"/>
      <text x="0" y="7" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#F0ABFC" text-anchor="middle">MY</text>
      <!-- Heart Icon / Badge -->
      <circle cx="28" cy="-28" r="14" fill="#9333EA"/>
      <text x="28" y="-22" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">💜</text>
    </g>

    <!-- Name & Title -->
    <text x="165" y="145" font-family="system-ui, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">Meethi Yadav</text>
    <rect x="25" y="158" width="280" height="26" rx="13" fill="#3B184C" stroke="#C084FC" stroke-opacity="0.6" stroke-width="1"/>
    <text x="165" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5D0FE" text-anchor="middle" letter-spacing="0.2">Inspiration Behind MEYRA AI / Brand Advisor</text>

    <!-- Divider -->
    <line x1="30" y1="202" x2="300" y2="202" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- Responsibilities -->
    <g font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" transform="translate(32, 230)">
      <!-- Bullet 1 -->
      <circle cx="6" cy="-4" r="3" fill="#C084FC"/>
      <text x="18" y="0" font-weight="700" fill="#F0ABFC">Inspiration</text>
      <text x="90" y="0" fill="#94A3B8">— Behind MEYRA AI</text>
      <text x="18" y="18" font-size="11" fill="#64748B">Origin &amp; inspiration of name &amp; concept</text>

      <!-- Bullet 2 -->
      <circle cx="6" cy="48" r="3" fill="#C084FC"/>
      <text x="18" y="52" font-weight="700" fill="#F0ABFC">Brand Advisor</text>
      <text x="110" y="52" fill="#94A3B8">— Identity &amp; Vision</text>
      <text x="18" y="70" font-size="11" fill="#64748B">Creative branding perspective</text>
      <text x="18" y="87" font-size="11" fill="#64748B">Aesthetic direction &amp; user resonance</text>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(600, 625)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="12" fill="#64748B" letter-spacing="1">
      MEYRA AI • ADVANCED MULTIMODAL INTELLIGENCE PLATFORM • PERMANENT OFFICIAL CORE TEAM
    </text>
  </g>
</svg>